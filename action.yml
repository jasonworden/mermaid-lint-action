name: 'mermaid-lint'
description: 'Validate Mermaid diagrams in Markdown files with inline PR annotations'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  files:
    description: >
      Space-separated glob patterns to validate.
      Defaults to git-tracked *.md / *.mmd / *.mdx files when omitted.
    required: false
    default: ''
  strict:
    description: >
      Pass --strict to mermaid-lint, promoting advisory warnings to failures.
      Note that rules whose own severity is "error" (duplicate-ids, for one)
      already fail the run without this.
    required: false
    default: 'false'
  version:
    description: >
      npm version range for @mermaid-lint/cli. Pinned by default so a floating
      action ref such as @v1 stays reproducible. Set to an empty string to
      always pull the latest release. Note the CLI is still 0.x, where npm
      reads a caret as patch-only — ^0.35.1 means >=0.35.1 <0.36.0.
    required: false
    default: '^0.35.1'
  working-directory:
    description: 'Directory to run mermaid-lint from. Defaults to repo root.'
    required: false
    default: '.'
outputs:
  diagrams:
    description: 'Total number of diagrams checked'
  errors:
    description: 'Number of diagrams with errors'
  warnings:
    description: 'Number of semantic warnings'
runs:
  using: 'node24'
  main: 'dist/index.js'
