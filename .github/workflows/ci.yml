name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and bundle freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # dist/ is committed because GitHub runs the bundle directly, so a stale
      # bundle ships source changes that silently never take effect. Rebuild and
      # fail if the result differs from what was committed.
      - name: Rebuild bundle
        run: npm run build

      # --porcelain rather than `git diff` so a newly emitted bundle file counts
      # as drift too; `git diff` alone would not see an untracked one.
      - name: Verify dist/ matches src/
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git status --porcelain -- dist/
            git diff -- dist/ | head -100
            exit 1
          fi
          echo "dist/ is in sync with src/"

  dogfood:
    name: Lint our own diagrams
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      # Uses the action from this checkout rather than a published ref, so the
      # code under review is what actually runs. Fixtures are excluded because
      # test/fixtures/invalid.md is broken on purpose.
      - uses: ./
        with:
          files: 'README.md test/fixtures/valid.md'
          strict: true

  dogfood-negative:
    name: Fail on a known-bad diagram
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - id: lint
        uses: ./
        continue-on-error: true
        with:
          files: 'test/fixtures/invalid.md'

      - name: Assert the action reported the failure
        env:
          OUTCOME: ${{ steps.lint.outcome }}
          ERRORS: ${{ steps.lint.outputs.errors }}
          DIAGRAMS: ${{ steps.lint.outputs.diagrams }}
        run: |
          echo "outcome=$OUTCOME errors=$ERRORS diagrams=$DIAGRAMS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::Expected the action to fail on invalid.md, got '$OUTCOME'."
            exit 1
          fi
          if [ "$ERRORS" != "1" ]; then
            echo "::error::Expected errors output to be 1, got '$ERRORS'."
            exit 1
          fi
          if [ "$DIAGRAMS" != "1" ]; then
            echo "::error::Expected diagrams output to be 1, got '$DIAGRAMS'."
            exit 1
          fi
