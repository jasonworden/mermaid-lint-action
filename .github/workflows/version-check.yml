# PR-time version bump check. Split out from ci.yml so it stays cheap and its
# failure reads as "you forgot to bump" rather than a generic CI failure.
name: Version Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version-check:
    name: Version bumped when the action changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history so the script can diff against origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: node scripts/check-version-bump.js
